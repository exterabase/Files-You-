name: files_you
description: Files You - file manager (Flutter + Rust)
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  dynamic_color: ^1.7.0
  shared_preferences: ^2.2.3
  path: ^1.9.0
  path_provider: ^2.1.3
  ffi: ^2.1.2
  url_launcher: ^6.3.0
  open_filex: ^4.4.0
  permission_handler: ^11.3.1
  file_picker: ^13.3.3
  webview_flutter: ^4.8.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  device_info_plus: ^13.3.0
  flutter_svg: ^2.0.10+1
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2
  video_player: ^2.9.1
dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/LICENSE.txt
