name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android project
        run: |
          flutter create --platforms=android --org com.filesyou --project-name files_you .
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              "MANAGE_EXTERNAL_STORAGE",
              "READ_EXTERNAL_STORAGE",
              "WRITE_EXTERNAL_STORAGE",
              "INTERNET",
              "ACCESS_NETWORK_STATE",
              "REQUEST_INSTALL_PACKAGES",
              "QUERY_ALL_PACKAGES",
          ]
          marker = "<application"
          additions = "".join(
              f'    <uses-permission android:name="android.permission.{permission}"/>\n'
              for permission in permissions
              if f"android.permission.{permission}" not in text
          )
          text = text.replace(marker, additions + marker, 1)
          import re
          text = re.sub(
              r'(<application\b[^>]*?)\bandroid:label="[^"]*"',
              r'\1android:label="Files You"',
              text,
              count=1,
          )
          text = text.replace(
              '<application',
              '<application android:usesCleartextTraffic="true" '
              'android:requestLegacyExternalStorage="true"',
              1,
          )
          text = re.sub(
              r'(<activity\b[^>]*android:name="\.MainActivity"[^>]*?)>',
              r'\1 android:label="Files You">',
              text,
              count=1,
          )
          text = text.replace(
              '</activity>',
              '''<intent-filter>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <category android:name="android.intent.category.BROWSABLE"/>
                      <data android:mimeType="application/zip"/>
                      <data android:mimeType="application/x-7z-compressed"/>
                      <data android:mimeType="application/x-rar-compressed"/>
                      <data android:mimeType="application/gzip"/>
                      <data android:mimeType="application/x-tar"/>
                      <data android:mimeType="application/vnd.android.package-archive"/>
                      <data android:mimeType="application/pdf"/>
                      <data android:mimeType="text/plain"/>
                      <data android:mimeType="text/html"/>
                      <data android:mimeType="application/msword"/>
                      <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document"/>
                      <data android:mimeType="application/vnd.ms-excel"/>
                      <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"/>
                      <data android:mimeType="application/vnd.ms-powerpoint"/>
                      <data android:mimeType="application/vnd.openxmlformats-officedocument.presentationml.presentation"/>
                    </intent-filter>
                  </activity>''',
              1,
          )
          manifest.write_text(text)
          PY
          rm -f android/app/src/main/kotlin/com/filesyou/files_you/MainActivity.kt
          rm -f android/app/src/main/java/com/filesyou/files_you/MainActivity.java
          mkdir -p android/app/src/main/java/com/filesyou/files_you
          cat > android/app/src/main/java/com/filesyou/files_you/MainActivity.java <<'JAVA'
          package com.filesyou.files_you;

          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.content.pm.PackageInstaller;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;
          import java.io.ByteArrayOutputStream;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import io.flutter.embedding.android.FlutterActivity;
          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.plugin.common.MethodChannel;

          public class MainActivity extends FlutterActivity {
            private static final String CHANNEL = "files_you/apps";

            @Override
            public void configureFlutterEngine(FlutterEngine engine) {
              super.configureFlutterEngine(engine);
              new MethodChannel(engine.getDartExecutor().getBinaryMessenger(), CHANNEL)
                  .setMethodCallHandler((call, result) -> {
                    if ("installedApps".equals(call.method)) {
                      new Thread(() -> {
                        List<Map<String, Object>> apps = installedApps();
                        new Handler(Looper.getMainLooper()).post(() -> result.success(apps));
                      }).start();
                    } else if ("launch".equals(call.method)) {
                      launch(String.valueOf(call.argument("package")));
                      result.success(null);
                    } else if ("uninstall".equals(call.method)) {
                      Intent i = new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + call.argument("package")));
                      startActivity(i);
                      result.success(null);
                    } else if ("categoryFiles".equals(call.method)) {
                      List<String> exts = call.argument("exts");
                      int limit = call.argument("limit") == null ? 1000 : (int) call.argument("limit");
                      new Thread(() -> {
                        List<Map<String, Object>> files = categoryFiles(exts, limit);
                        new Handler(Looper.getMainLooper()).post(() -> result.success(files));
                      }).start();
                    } else if ("installBundle".equals(call.method)) {
                      new Thread(() -> {
                        boolean installed = installBundle(String.valueOf(call.argument("path")));
                        new Handler(Looper.getMainLooper()).post(() -> result.success(installed));
                      }).start();
                    } else if ("initialIntentPath".equals(call.method)) {
                      result.success(initialIntentPath());
                    } else {
                      result.notImplemented();
                    }
                  });
            }

            private List<Map<String, Object>> installedApps() {
              PackageManager pm = getPackageManager();
              List<Map<String, Object>> out = new ArrayList<>();
              for (ApplicationInfo app : pm.getInstalledApplications(PackageManager.GET_META_DATA)) {
                if (getPackageName().equals(app.packageName)) continue;
                Map<String, Object> item = new HashMap<>();
                item.put("label", String.valueOf(pm.getApplicationLabel(app)));
                item.put("package", app.packageName);
                item.put("system", (app.flags & ApplicationInfo.FLAG_SYSTEM) != 0);
                out.add(item);
              }
              out.sort((a, b) -> String.valueOf(a.get("label")).compareToIgnoreCase(String.valueOf(b.get("label"))));
              return out;
            }

            private List<Map<String, Object>> categoryFiles(List<String> exts, int limit) {
              List<Map<String, Object>> out = new ArrayList<>();
              String[] projection = {
                MediaStore.Files.FileColumns.DATA,
                MediaStore.Files.FileColumns.SIZE,
                MediaStore.Files.FileColumns.DATE_MODIFIED,
                MediaStore.Files.FileColumns.MIME_TYPE
              };
              try (android.database.Cursor c = getContentResolver().query(
                  MediaStore.Files.getContentUri("external"),
                  projection,
                  null,
                  null,
                  MediaStore.Files.FileColumns.DATE_MODIFIED + " DESC")) {
                if (c == null) return out;
                int dataIndex = c.getColumnIndexOrThrow(MediaStore.Files.FileColumns.DATA);
                int sizeIndex = c.getColumnIndexOrThrow(MediaStore.Files.FileColumns.SIZE);
                int modifiedIndex = c.getColumnIndexOrThrow(MediaStore.Files.FileColumns.DATE_MODIFIED);
                while (c.moveToNext() && out.size() < limit) {
                  String path = c.getString(dataIndex);
                  if (path == null) continue;
                  int dot = path.lastIndexOf('.');
                  if (dot < 0) continue;
                  String ext = path.substring(dot + 1).toLowerCase();
                  if (exts != null && !exts.isEmpty() && !exts.contains(ext)) continue;
                  Map<String, Object> item = new HashMap<>();
                  item.put("path", path);
                  item.put("size", c.getLong(sizeIndex));
                  item.put("modified", c.getLong(modifiedIndex));
                  out.add(item);
                }
              } catch (Exception ignored) {}
              return out;
            }

            private void launch(String packageName) {
              Intent intent = getPackageManager().getLaunchIntentForPackage(packageName);
              if (intent != null) startActivity(intent);
            }

            private String initialIntentPath() {
              Intent intent = getIntent();
              Uri uri = intent == null ? null : intent.getData();
              if (uri == null) return null;
              if ("file".equalsIgnoreCase(uri.getScheme())) return uri.getPath();
              if (!"content".equalsIgnoreCase(uri.getScheme())) return uri.toString();
              String name = uri.getLastPathSegment();
              if (name == null || name.isEmpty()) name = "incoming-file";
              File out = new File(getCacheDir(), name.replaceAll("[^a-zA-Z0-9._-]", "_"));
              try (InputStream in = getContentResolver().openInputStream(uri);
                   OutputStream stream = new java.io.FileOutputStream(out)) {
                if (in == null) return null;
                byte[] buf = new byte[8192];
                int n;
                while ((n = in.read(buf)) != -1) stream.write(buf, 0, n);
                return out.getAbsolutePath();
              } catch (Exception e) {
                return null;
              }
            }

            private boolean installBundle(String path) {
              File source = new File(path);
              if (!source.isFile()) return false;
              ArrayList<File> apks = new ArrayList<>();
              if (path.toLowerCase().endsWith(".apk")) {
                apks.add(source);
              } else {
                try (ZipInputStream zip = new ZipInputStream(new FileInputStream(source))) {
                  ZipEntry entry;
                  File dir = new File(getCacheDir(), "bundle-" + System.currentTimeMillis());
                  if (!dir.mkdirs()) return false;
                  while ((entry = zip.getNextEntry()) != null) {
                    if (entry.isDirectory() || !entry.getName().toLowerCase().endsWith(".apk")) continue;
                    File apk = new File(dir, new File(entry.getName()).getName());
                    try (OutputStream out = new java.io.FileOutputStream(apk)) {
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = zip.read(buf)) != -1) out.write(buf, 0, n);
                    }
                    apks.add(apk);
                  }
                } catch (Exception e) {
                  return false;
                }
              }
              if (apks.isEmpty()) return false;
              PackageInstaller installer = getPackageManager().getPackageInstaller();
              PackageInstaller.SessionParams params = new PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL);
              params.setSize(0);
              int id;
              try {
                id = installer.createSession(params);
                PackageInstaller.Session session = installer.openSession(id);
                for (File apk : apks) {
                  try (FileInputStream in = new FileInputStream(apk);
                       OutputStream out = session.openWrite(apk.getName(), 0, apk.length())) {
                    byte[] buf = new byte[8192];
                    int n;
                    while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                    session.fsync(out);
                  }
                }
                Intent status = new Intent(MainActivity.this, MainActivity.class);
                session.commit(PendingIntent.getBroadcast(MainActivity.this, id, status, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE).getIntentSender());
                return true;
              } catch (Exception e) {
                return false;
              }
            }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path

          for path in Path("android").rglob("*.gradle*"):
              text = path.read_text()
              text = text.replace("flutter.compileSdkVersion", "36")
              text = text.replace("compileSdkVersion 34", "compileSdkVersion 36")
              text = text.replace("compileSdk = 34", "compileSdk = 36")
              path.write_text(text)
          PY
          grep -R "compileSdk" android

      - name: Set up Android NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager_path="$(find "$sdk_root" -type f -name sdkmanager | head -1)"
          test -n "$sdkmanager_path"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-36" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build Rust libraries
        run: |
          cargo install cargo-ndk --locked
          cd rust
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build --release

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: files-you-apk
          path: build/app/outputs/flutter-apk/app-release.apk
