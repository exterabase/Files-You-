name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android project
        run: flutter create --platforms=android --org com.filesyou --project-name files_you .

      - name: Set up Android NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager_path="$(find "$sdk_root" -type f -name sdkmanager | head -1)"
          test -n "$sdkmanager_path"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build Rust libraries
        run: |
          cargo install cargo-ndk --locked
          cd rust
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build --release

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: files-you-apk
          path: build/app/outputs/flutter-apk/app-release.apk
